<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <!-- CSS luon link o head -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <section class="topbar">
        <div class="header">
            <div>
                <label class="brand">Ligma</label>
            </div>

            <div class="rightbtn">
                <button class="home">
                    <a href="index.html">Home</a>
                </button>
                <button class="loogin">
                    <a href="login.html">Login</a>
                </button>
                <button class="siggnup">
                    <a href="signup.html">Signup</a>
                </button>
            </div>
        </div>
    </section>

    <section class="llogin">
        <div class="logrin">
            <h1 class="Login">Register</h1>
            <form method="get" id="lform">
                <div class="user">
                    <h3 class="username">Username</h3>
                    <input required type="text" class="uname" autocomplete="off" placeholder="Enter your username" id="loga" name="username">
                </div>
                <div class="pass">
                    <h3 class="password">Password</h3>
                    <input type="text" class="upass" autocomplete="off" placeholder="Enter your password" id="logan" name="password">
                </div>
                <a href="forgotpassword.html" class="fpass">Forgot password?</a>
                <h4 class="hasign">Don't have an account?
                    <a href="signup.html" class="sig">Sign up</a>
                </h4>
                <button type="submit" class="buton">Login</button>
            </form>
        </div>

    </section>


    <!-- JS se luon link tai cuoi body -->
    <script src="login.js"></script>
</body>

</html>
